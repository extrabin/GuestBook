# 애플리케이션 이름
spring.application.name=guestbook

# 내장 톰캣 포트 (9장에서 Nginx가 이 포트로 리버스 프록시)
server.port=8080

# 프록시(로드 밸런서·Nginx) 뒤에서 원래 요청 정보를 신뢰하도록 설정
# 14장에서 로드 밸런서가 HTTPS를 종료할 때, 앱이 원본 스킴을 인식하게 해줍니다.
server.forward-headers-strategy=framework

# 방명록에 유지할 최대 메시지 수 (메모리 저장이므로 상한을 둠)
guestbook.max-entries=100